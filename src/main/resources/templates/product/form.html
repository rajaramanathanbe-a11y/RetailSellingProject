<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Product Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">
    <h2 th:text="${product.id == null ? 'Add Product' : 'Edit Product'}"></h2>

    <form th:action="@{/ui/products/add}" th:object="${product}" method="post">
		
		<input type="hidden" th:field="*{id}">

        <label>Name</label>
        <input type="text" th:field="*{name}">
        <div class="error" th:if="${#fields.hasErrors('name')}"
             th:errors="*{name}"></div>

        <label>Category</label>
        <input type="text" th:field="*{category}">
        <div class="error" th:errors="*{category}"></div>

        <label>Brand</label>
        <input type="text" th:field="*{brand}">
        <div class="error" th:errors="*{brand}"></div>

        <label>Base Price</label>
        <input type="number" step="0.01" th:field="*{basePrice}">
        <div class="error" th:errors="*{basePrice}"></div>

        <label>Stock Quantity</label>
        <input type="number" th:field="*{stockQuantity}">
        <div class="error" th:errors="*{stockQuantity}"></div>

        <button type="submit">Save</button>
        <a href="/ui/products">Cancel</a>
    </form>
</div>

</body>
</html>
