<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Rule Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">
    <h2 th:text="${rule.id == null ? 'Add Rule' : 'Edit Rule'}"></h2>

    <form th:object="${rule}" th:action="@{/ui/rules/add}" method="post">

		<input type="hidden" th:field="*{id}">
		
        <label>Name</label>
        <input th:field="*{name}">

        <label>Rule Type</label>
        <select th:field="*{ruleType}">
            <option th:each="t : ${types}"
                    th:value="${t}"
                    th:text="${t}">
            </option>
        </select>

        <label>Value</label>
        <input type="number" step="0.01" th:field="*{value}">

        <label>Priority</label>
        <input type="number" th:field="*{priority}">

        <label>Condition JSON</label>
        <textarea th:field="*{conditionJson}"></textarea>

        <label>
            <input type="checkbox" th:field="*{isActive}"> Active
        </label>

        <button type="submit">Save</button>
        <a href="/ui/rules">Cancel</a>
    </form>
</div>

</body>
</html>
